name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Generate Xcode Project
      run: |
        brew install xcodegen
        
        cat <<EOF > project.yml
        name: CreatureGame
        options:
          xcodeVersion: "15.0"
        targets:
          CreatureGame:
            type: application
            platform: iOS
            deploymentTarget: "17.0"
            sources: 
              - CreatureGameApp.swift
            settings:
              GENERATE_INFOPLIST_FILE: YES
              PRODUCT_BUNDLE_IDENTIFIER: com.fedor.creaturegame
              CURRENT_PROJECT_VERSION: "1.0"
              MARKETING_VERSION: "1.0"
              INFOPLIST_KEY_UILaunchScreen_Generation: YES
              INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
              INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        EOF
        
        xcodegen generate
        sed -i '' 's/objectVersion = [0-9]*/objectVersion = 60/g' CreatureGame.xcodeproj/project.pbxproj

    - name: Build App
      run: |
        xcodebuild clean build \
          -project CreatureGame.xcodeproj \
          -scheme CreatureGame \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/CreatureGame.app Payload/
        zip -r CreatureGame-Unsigned.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CreatureGame-IPA
        path: CreatureGame-Unsigned.ipa
